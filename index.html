<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - INNFOCUS</title>
  
  <!-- Carga de A-Frame para el motor 3D -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- Carga de AR.js para detectar el marcador con la cámara -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<link type="text/css" rel="stylesheet" href="css/style.css"/>
</head>

<body style="margin: 0; overflow: hidden;">

  <!-- Escena principal de Realidad Aumentada -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">
    
    <!-- Recurso: Imagen de la insignia de Explorador -->
    <a-assets>
      <img id="insignia-explorador" src="1788747483790.jpg">
    </a-assets>

    <!-- Marcador personalizado apuntando a pattern-photo.patt -->
    <a-marker type="pattern" url="pattern-photo.patt">
      
      <!-- Contenedor con animación de giro lento (360 grados en 10 segundos) -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        
        <!-- Texto superior en fuente Montserrat -->
        <a-text 
          value="Mi perfil INNFOCUS es" 
          font="https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/montserrat/Montserrat-Bold.json"
          shader="msdf"
          align="center" 
          position="0 1.5 0" 
          scale="1.2 1.2 1.2" 
          color="#FFFFFF">
        </a-text>

        <!-- Modelo 2D/3D (Insignia de Explorador) sobre el marcador -->
        <a-plane 
          src="#insignia-explorador" 
          position="0 0.4 0" 
          rotation="-20 0 0" 
          width="1.6" 
          height="1.6" 
          material="transparent: true; alphaTest: 0.5">
        </a-plane>

      </a-entity>

    </a-marker>

    <!-- Activa la cámara del dispositivo y solicita permisos -->
    <a-entity camera></a-entity>

  </a-scene>

<script type="text/javascript" src="js/script.js"></script>
</body>
</html>
