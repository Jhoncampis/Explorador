<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>INNFOCUS - Realidad Aumentada</title>

  <!-- Fuente Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js para A-Frame (version marcador/pattern) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* Aviso mientras carga / pide permisos de camara */
    #overlay {
      position: fixed;
      z-index: 999;
      top: 0; left: 0; right: 0;
      padding: 14px 18px;
      background: rgba(20, 20, 30, 0.75);
      color: #fff;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    /* Texto flotante en HTML que sigue mostrandose sobre el video mientras
       no hay marcador (informativo, no forma parte de la escena AR) */
    #hint {
      position: fixed;
      z-index: 998;
      bottom: 18px;
      left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-size: 13px;
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    /* Boton para cambiar de camara (frontal / trasera) */
    #switchCameraBtn {
      position: fixed;
      z-index: 999;
      bottom: 18px;
      right: 18px;
      padding: 10px 16px;
      border: none;
      border-radius: 24px;
      background: rgba(20, 20, 30, 0.75);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div id="overlay">Apunta la camara al marcador HIRO</div>
  <div id="hint">Buscando marcador...</div>
  <button id="switchCameraBtn">🔄 Cambiar camara</button>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
  >

    <a-assets>
      <img id="badgeTex" src="assets/badge-medal.png" crossorigin="anonymous">
    </a-assets>

    <!-- Marcador estandar HIRO (viene incluido en AR.js, no requiere .patt propio) -->
    <a-marker
      preset="hiro"
      id="innfocusMarker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!-- Texto encima del modelo (bien arriba en el eje Y para que la
           moneda, al girar en Z, nunca lo tape), dibujado en un canvas
           con la fuente Montserrat real y usado como textura. -->
      <a-plane
        id="textPlane"
        position="0 2.3 0"
        rotation="-90 0 0"
        width="2.6"
        height="0.65"
        material="transparent: true; opacity: 0; shader: flat"
      ></a-plane>

      <!-- "Modelo 3D": una moneda que queda acostada en el MISMO PLANO
           que el marcador (caras mirando hacia arriba/abajo, igual que
           el marcador esta acostado en la mesa) y gira sobre el eje Z,
           como una moneda de verdad dando vueltas: cara -> canto -> cara. -->
      <a-entity
        id="badge3d"
        position="0 0.7 0"
        scale="0.55 0.55 0.55"
        animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear"
      >
        <!-- Cara de arriba -->
        <a-circle
          radius="1"
          segments="64"
          position="0 0.061 0"
          rotation="-90 0 0"
          material="src: #badgeTex; shader: flat; transparent: true; alphaTest: 0.5; side: front"
        ></a-circle>

        <!-- Cara de abajo (misma imagen, mirando hacia el otro lado) -->
        <a-circle
          radius="1"
          segments="64"
          position="0 -0.061 0"
          rotation="90 0 0"
          material="src: #badgeTex; shader: flat; transparent: true; alphaTest: 0.5; side: front"
        ></a-circle>

        <!-- Canto de la moneda (grosor); eje Y por defecto, igual que las caras -->
        <a-cylinder
          radius="0.995"
          height="0.12"
          material="color: #C9A227; metalness: 0.6; roughness: 0.35; shader: standard"
        ></a-cylinder>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const marker = document.querySelector('#innfocusMarker');
    const hint = document.getElementById('hint');
    marker.addEventListener('markerFound', () => { hint.style.display = 'none'; });
    marker.addEventListener('markerLost', () => {
      hint.style.display = 'block';
      hint.textContent = 'Buscando marcador...';
    });

    // Dibuja el texto "Mi perfil INNFOCUS es" en Montserrat sobre un canvas
    // y lo usa como textura del a-plane, para asegurar que se vea con la
    // tipografia correcta Y COMPLETO (calcula el tamano de letra que si
    // cabe en el ancho del canvas, en vez de usar un tamano fijo).
    function pintarTextoMontserrat() {
      const canvas = document.createElement('canvas');
      canvas.width = 1600;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fondo semitransparente para que el texto se lea sobre cualquier fondo
      ctx.fillStyle = 'rgba(20, 10, 45, 0.6)';
      roundRect(ctx, 10, 60, canvas.width - 20, canvas.height - 120, 60);
      ctx.fill();

      const texto = 'Mi perfil INNFOCUS es';
      const maxAncho = canvas.width - 120; // margen para que no toque los bordes
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFFFFF';

      // Reduce el tamano de letra hasta que el texto entre completo
      let fontSize = 150;
      let anchoTexto;
      do {
        ctx.font = "700 " + fontSize + "px 'Montserrat'";
        anchoTexto = ctx.measureText(texto).width;
        if (anchoTexto > maxAncho) fontSize -= 4;
      } while (anchoTexto > maxAncho && fontSize > 20);

      ctx.fillText(texto, canvas.width / 2, canvas.height / 2 + 6);

      const textPlane = document.querySelector('#textPlane');
      textPlane.setAttribute('material', {
        src: canvas.toDataURL('image/png'),
        transparent: true,
        opacity: 1,
        shader: 'flat'
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Espera a que la fuente Montserrat este realmente cargada antes de dibujar
    if (document.fonts && document.fonts.load) {
      document.fonts.load("700 96px 'Montserrat'").then(pintarTextoMontserrat).catch(pintarTextoMontserrat);
      document.fonts.ready.then(pintarTextoMontserrat);
    } else {
      window.addEventListener('load', pintarTextoMontserrat);
    }

    // ---------------------------------------------------------------
    // Cambio de camara (frontal / trasera)
    // ---------------------------------------------------------------
    // AR.js pide la camara automaticamente al iniciar (por eso el navegador
    // pide permiso), pero por defecto suele abrir la trasera. Aqui tomamos
    // control del <video> que crea AR.js y le forzamos la camara delantera
    // apenas esta disponible, y dejamos un boton para alternar despues.
    let facingModeActual = 'user'; // 'user' = delantera, 'environment' = trasera

    function obtenerVideoAR() {
      return document.querySelector('#arjs-video') || document.querySelector('video');
    }

    function pedirCamara(facingMode) {
      const video = obtenerVideoAR();
      if (!video) return;

      // Muy importante: soltar la camara que este activa ANTES de pedir
      // la nueva. La mayoria de celulares no permiten tener 2 camaras
      // abiertas al mismo tiempo (por eso antes daba "no se pudo acceder").
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(function (t) { t.stop(); });
        video.srcObject = null;
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: facingMode } },
        audio: false
      }).then(function (stream) {
        video.srcObject = stream;
        video.play().catch(function () {});
        facingModeActual = facingMode;

        // avisa a AR.js que revise el tamano de la fuente de video
        setTimeout(function () {
          window.dispatchEvent(new Event('resize'));
        }, 300);
      }).catch(function (err) {
        console.warn('No se pudo cambiar de camara:', err);
        alert('No se pudo acceder a esa camara en este dispositivo o navegador.');
      });
    }

    // Espera a que AR.js tenga la camara REALMENTE encendida y dando
    // imagen (no solo el <video> creado) antes de tocar nada, para no
    // pelear por el dispositivo con la propia inicializacion de AR.js.
    // Recien ahi la cambiamos a la delantera.
    function iniciarConCamaraDelantera() {
      const video = obtenerVideoAR();
      if (video && video.readyState >= 2 && video.videoWidth > 0) {
        pedirCamara('user');
      } else {
        setTimeout(iniciarConCamaraDelantera, 250);
      }
    }
    iniciarConCamaraDelantera();

    document.getElementById('switchCameraBtn').addEventListener('click', function () {
      const nuevaCamara = facingModeActual === 'user' ? 'environment' : 'user';
      pedirCamara(nuevaCamara);
    });
  </script>

</body>
</html>
